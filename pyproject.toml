[project]
name = "autoclicker"
version = "0.1.0"
description = "Pick a point, schedule one click in local time, and exit."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "pyside6-essentials>=6.8,<7",
    "pyobjc-framework-Quartz>=10.3; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=10.3; sys_platform == 'darwin'",
    "pyobjc-framework-ApplicationServices>=10.3; sys_platform == 'darwin'",
    "tzlocal>=5.2,<6",
    "tzdata>=2024.1",
]

[project.scripts]
autoclicker = "autoclicker.app:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
